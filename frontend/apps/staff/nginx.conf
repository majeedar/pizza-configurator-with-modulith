server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build hashes every asset filename (index-<hash>.js), so those
    # are safe to cache forever — the only thing that ever needs to be
    # re-fetched on a new deploy is index.html itself, which references the
    # new hashed filenames. Without this, nginx's default heuristic caching
    # can leave a browser holding an index.html that still points at JS
    # bundles a newer deploy already deleted from the container.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
