# Production deployment on a single Hetzner VM (agent.md §27) — a
# standalone file, not an overlay of compose.yaml, so there's no ambiguity
# about which service definitions apply (Compose merges list fields like
# `ports` across -f files rather than replacing them, which would make
# "don't publish this port in production" awkward to express as an overlay).
#
# Usage on the VM (also what deploy.yml's `docker compose pull && up -d`
# step runs):
#   cp .env.example .env   # then fill in real production values
#   DOMAIN=example.com CERTBOT_EMAIL=admin@example.com ./infrastructure/nginx/init-letsencrypt.sh
#   docker compose -f compose.prod.yaml up -d
#
# Images are pulled from GHCR (see .github/workflows/container-build.yml and
# deploy.yml) rather than built on the VM — the VM never runs `mvn`/`npm`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    # No published host port — only the backend (on the same Compose network)
    # talks to Postgres. Nothing on the public internet reaches it directly.

  backend:
    image: ${GHCR_IMAGE_BACKEND:-ghcr.io/example/pizza-configurator-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER}
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_PROBABILITY: ${OTEL_TRACES_SAMPLER_PROBABILITY:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
    # No published host port — only nginx (below) reaches it, over the
    # internal Compose network, never directly from the public internet.

  customer-web:
    image: ${GHCR_IMAGE_CUSTOMER_WEB:-ghcr.io/example/pizza-configurator-customer-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  staff-web:
    image: ${GHCR_IMAGE_STAFF_WEB:-ghcr.io/example/pizza-configurator-staff-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - ./infrastructure/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./infrastructure/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - customer-web
      - staff-web

  # Renews the certificate twice a day (certbot no-ops unless a cert is
  # within its renewal window, ~30 days of expiry) and nginx's own
  # `include /etc/nginx/conf.d/*.conf` picks up renewed files on its next
  # reload — pair this with a cron/systemd timer on the VM that runs
  # `docker compose -f compose.prod.yaml exec nginx nginx -s reload` daily,
  # or simply restart nginx on the same cadence.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/certbot/conf:/etc/letsencrypt
      - ./infrastructure/nginx/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  postgres-data:
