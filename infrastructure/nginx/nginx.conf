user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # agent.md §14.4 "rate limiting at reverse proxy or application edge" and
    # §14.4 "request size limits" — applied per-zone in conf.d/*.conf. Keyed
    # on the real client IP as forwarded by... nothing yet, since nginx here
    # *is* the edge (no CDN/LB in front of it on the single-Hetzner-VM
    # topology, agent.md §27), so $binary_remote_addr is trustworthy.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    limit_req_status 429;

    client_max_body_size 1m;

    # Secure headers (agent.md §14.4) applied to every response proxied
    # through nginx, on top of the backend's own Spring Security headers
    # (security/web/SecurityFilterChainConfiguration.java) — belt and
    # braces, since the frontend static sites never pass through Spring
    # Security at all.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/*.conf;
}
