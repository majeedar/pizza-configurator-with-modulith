name: deploy

# Main/release pipeline (agent.md §22/§26/§27): build immutable images, tag
# with the Git SHA, scan them, publish to GHCR, then SSH into the Hetzner VM
# and swap compose.shared-vm.yaml over to the new tag. Never deploys `latest`
# alone — the VM is always told an explicit immutable IMAGE_TAG.
#
# Uses compose.shared-vm.yaml, not compose.prod.yaml: the actual target VM
# already hosts another site on ports 80/443, so this deployment publishes
# backend/customer-web/staff-web directly on alternate host ports (8080/
# 8081/8082) with no nginx/TLS/domain layer, rather than agent.md §27's
# original dedicated-VM-with-domain design (compose.prod.yaml, kept for if a
# dedicated VM or domain becomes available later).
#
# Rollback (agent.md §27): re-run this workflow via workflow_dispatch with
# `image_tag` set to a previous commit's short SHA — it redeploys that
# already-published image rather than rebuilding, since GHCR still has it.
#
# Requires repository secrets: HETZNER_HOST, HETZNER_SSH_USER,
# HETZNER_SSH_KEY (deploy-only key). GHCR auth uses the automatically
# provisioned GITHUB_TOKEN (repo Settings → Actions → General → Workflow
# permissions → Read and write), not a separate manual PAT — simpler than
# agent.md §24's original GHCR_TOKEN secret and equally sufficient, since
# this workflow only ever pushes to its own repository's package namespace.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/apps/customer/**"
      - "frontend/apps/staff/**"
      - "compose.shared-vm.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to (re)deploy, e.g. a previous short SHA for rollback. Defaults to the current commit."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-publish:
    if: github.event_name == 'push' || github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
          - image: customer-web
            context: frontend/apps/customer
          - image: staff-web
            context: frontend/apps/staff
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: repo
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          # The two frontend apps bake their API base URL in at build time
          # (Vite convention) — pointed at the backend's alternate host port
          # on the same VM, since there's no domain/nginx routing here.
          build-args: |
            VITE_API_BASE_URL=http://${{ secrets.HETZNER_HOST }}:8080
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.value }}-${{ matrix.image }}:${{ steps.tag.outputs.value }}

      - name: Scan with Trivy before publishing
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.value }}-${{ matrix.image }}:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (immutable Git-SHA tag + latest)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            VITE_API_BASE_URL=http://${{ secrets.HETZNER_HOST }}:8080
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.value }}-${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.value }}-${{ matrix.image }}:latest

  deploy:
    needs: [build-scan-publish]
    if: always() && (needs.build-scan-publish.result == 'success' || needs.build-scan-publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ needs.build-scan-publish.outputs.image_tag }}"; fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - id: repo
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/pizza-configurator
            git pull
            export IMAGE_TAG=${{ steps.tag.outputs.value }}
            export GHCR_IMAGE_BACKEND=ghcr.io/${{ steps.repo.outputs.value }}-backend
            export GHCR_IMAGE_CUSTOMER_WEB=ghcr.io/${{ steps.repo.outputs.value }}-customer-web
            export GHCR_IMAGE_STAFF_WEB=ghcr.io/${{ steps.repo.outputs.value }}-staff-web
            docker compose -f compose.shared-vm.yaml pull
            docker compose -f compose.shared-vm.yaml up -d
            docker image prune -f

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${{ secrets.HETZNER_HOST }}:8080/actuator/health" | grep -q '"status":"UP"'; then
              echo "Smoke test passed."
              exit 0
            fi
            echo "Attempt $i: not healthy yet, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed — backend did not report UP after deploy." >&2
          exit 1
