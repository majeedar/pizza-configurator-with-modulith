name: android-ci

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-android, kitchen-android]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # Windows git doesn't preserve the Unix executable bit by default —
      # this repo was authored on Windows, so gradlew can land non-executable
      # on a Linux runner even though `git update-index --chmod=+x` was set;
      # belt-and-suspenders so a future commit from Windows can't silently
      # regress this again.
      - run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.app }}-${{ hashFiles(format('mobile/{0}/**/*.gradle.kts', matrix.app)) }}
          restore-keys: gradle-${{ matrix.app }}-

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: mobile/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
