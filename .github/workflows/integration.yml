name: integration

# E2E pipeline (agent.md §26): start the real compose stack, run Playwright
# against it, collect logs on failure, tear down. This is the "no persistent
# staging VM for v1" pre-release verification agent.md §27 describes — the
# ephemeral stack itself is the staging environment.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack
        run: |
          cp .env.example .env
          docker compose up -d --build
        env:
          CUSTOMER_WEB_PORT: "3000"
          STAFF_WEB_PORT: "3001"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is up."
              exit 0
            fi
            sleep 3
          done
          echo "Backend never became healthy." >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          CI: "true"
          CUSTOMER_WEB_URL: http://localhost:3000
          STAFF_WEB_URL: http://localhost:3001
          BACKEND_URL: http://localhost:8080
        run: npx playwright test

      - name: Collect compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
